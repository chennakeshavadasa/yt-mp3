name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/YT-MP3-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: YT-MP3-apk
          path: out/*.apk

      - name: Publish as a Release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YT MP3 build ${{ github.run_number }}
          files: out/*.apk
